<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25F4EE" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FE2C55" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100" height="100" rx="24" fill="#060913" stroke="#25F4EE" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Cyan offset layer -->
  <path d="M48 20 L74 42 L62 58 L42 38 Z" fill="#25F4EE" opacity="0.9" transform="translate(-2, -1)" />
  <!-- Magenta offset layer -->
  <path d="M48 20 L74 42 L62 58 L42 38 Z" fill="#FE2C55" opacity="0.9" transform="translate(2, 1)" />
  <path d="M48 20 L74 42 L62 58 L42 38 Z" fill="#FFFFFF" />

  <path d="M30 42 L58 64 L48 80 L26 58 Z" fill="#25F4EE" opacity="0.9" transform="translate(-1.5, -1)" />
  <path d="M30 42 L58 64 L48 80 L26 58 Z" fill="#A855F7" opacity="0.9" transform="translate(1.5, 1)" />
  <path d="M30 42 L58 64 L48 80 L26 58 Z" fill="#FFFFFF" />

  <circle cx="48" cy="50" r="7" fill="url(#markGrad)" filter="url(#glow)" />
