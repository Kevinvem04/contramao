<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25F4EE" />
      <stop offset="100%" stop-color="#00C8FF" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FE2C55" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon: Flying Wing + TikTok chromatic vibe -->
  <g transform="translate(15, 10)">
    <!-- Cyan offset layer -->
    <path d="M28 8 L52 28 L42 42 L24 24 Z" fill="#25F4EE" opacity="0.85" transform="translate(-2.5, -1.5)" />
    <!-- Pink/Magenta offset layer -->
    <path d="M28 8 L52 28 L42 42 L24 24 Z" fill="#FE2C55" opacity="0.85" transform="translate(2.5, 1.5)" />
    <!-- Main white polygon -->
    <path d="M28 8 L52 28 L42 42 L24 24 Z" fill="#FFFFFF" />
    
    <!-- Wing 2 -->
    <path d="M12 28 L38 50 L28 64 L8 42 Z" fill="#25F4EE" opacity="0.85" transform="translate(-2, -1)" />
    <path d="M12 28 L38 50 L28 64 L8 42 Z" fill="#A855F7" opacity="0.85" transform="translate(2, 1)" />
    <path d="M12 28 L38 50 L28 64 L8 42 Z" fill="#FFFFFF" />

    <!-- Core energy pulse -->
    <circle cx="28" cy="36" r="6" fill="#25F4EE" filter="url(#glowCyan)" />
  </g>

  <!-- Typography: TOKFLY (White TOK, Chromatic FLY) -->
  <text x="88" y="58" font-family="'Montserrat', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#FFFFFF">
    TOK<tspan fill="url(#cyanGrad)">F</tspan><tspan fill="url(#purpleGrad)">LY</tspan>
  </text>

  <!-- Tagline badge -->
  <text x="92" y="76" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="4" fill="#00E5FF" opacity="0.9">
    TIKTOK ADS ACCELERATION
  </text>
</svg>
